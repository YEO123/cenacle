<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Cénacle</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="public">
  <main class="public-card narrow">
    <img src="/logo.png" alt="Apostolat Missionnaire du Cénacle" class="public-logo">
    <form id="form">
      <h1>Espace administrateur</h1>
      <label>Identifiant<input name="username" required autocomplete="username" autofocus></label>
      <label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label>
      <p class="error" id="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
