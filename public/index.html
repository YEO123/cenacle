<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigile de Gloire 2026 — Cénacle</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="public">
  <main class="public-card">
    <img src="/logo.png" alt="Apostolat Missionnaire du Cénacle" class="public-logo">

    <form id="form" novalidate>
      <h1 class="welcome"><span>Bienvenue à la</span> <span class="welcome-main">Vigile de Gloire 2026</span></h1>
      <p class="intro">Merci de renseigner vos informations.</p>

      <fieldset class="genre">
        <legend>Genre *</legend>
        <div class="genre-options">
          <label><input type="radio" name="genre" value="F" required><span>F</span></label>
          <label><input type="radio" name="genre" value="M" required><span>M</span></label>
        </div>
      </fieldset>

      <label>Nom *<input name="nom" required maxlength="200" autocomplete="family-name"></label>
      <label>Prénoms *<input name="prenoms" required maxlength="200" autocomplete="given-name"></label>
      <label>Date de naissance *<input name="date_naissance" type="date" required autocomplete="bday"></label>
      <label>Pays *<select name="pays" id="pays" required autocomplete="country"></select></label>
      <label>Adresse *<input name="adresse" required maxlength="200" autocomplete="street-address"></label>
      <div class="row">
        <label><span>Code postal <span id="cp-mark">*</span></span><input name="code_postal" id="code_postal" required maxlength="20" autocomplete="postal-code"></label>
        <label>Ville *<input name="ville" required maxlength="200" autocomplete="address-level2"></label>
      </div>

      <div class="phone">
        <label for="telephone">Téléphone *</label>
        <div class="phone-field">
          <div class="phone-dial">
            <span id="dial-display" aria-hidden="true"></span>
            <select name="indicatif" id="indicatif" aria-label="Indicatif du pays" required></select>
          </div>
          <input id="telephone" name="telephone" type="tel" required maxlength="25" autocomplete="tel-national">
        </div>
      </div>
      <label>Email<input name="email" type="email" maxlength="200" autocomplete="email"></label>

      <!-- Piège à robots : invisible pour les visiteurs -->
      <label class="trap" aria-hidden="true">Site web<input name="site_web" tabindex="-1" autocomplete="off"></label>

      <label class="consent">
        <input type="checkbox" name="consentement" required>
        <span>
          J'accepte que l'Apostolat Missionnaire du Cénacle conserve les données
          ci-dessus et les utilise pour m'informer de ses prochains programmes. Je peux retirer ce consentement
          à tout moment auprès de ses responsables : mes données seront alors supprimées.
        </span>
      </label>

      <p class="error" id="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit">Envoyer</button>
    </form>

    <section id="thanks" class="thanks" hidden>
      <h1>Merci !</h1>
      <p>Votre inscription est bien enregistrée.</p>
      <p class="blessing">Bonne prière, Dieu vous bénisse !</p>
    </section>
  </main>

  <script type="module" src="/inscription.js"></script>
</body>
</html>
